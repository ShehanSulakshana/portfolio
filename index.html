    <!-- Defensive filter for third-party browser extensions in iframes -->
    <script>
      (function() {
        try {
          if (typeof window !== 'undefined') {
            window.chrome = window.chrome || {};
            if (!window.chrome.runtime) {
              window.chrome.runtime = {
                onMessage: {
                  addListener: function() {},
                  removeListener: function() {},
                  hasListener: function() { return false; }
                },
                sendMessage: function() {}
              };
            } else if (!window.chrome.runtime.onMessage) {
              window.chrome.runtime.onMessage = {
                addListener: function() {},
                removeListener: function() {},
                hasListener: function() { return false; }
              };
            }
          }
        } catch (e) {}

        window.addEventListener('error', function(event) {
          try {
            var filename = (event && event.filename) || '';
            var message = (event && event.message) || '';
            if (
              filename.indexOf('chrome-extension://') !== -1 ||
              filename.indexOf('moz-extension://') !== -1 ||
              filename.indexOf('safari-extension://') !== -1 ||
              message.indexOf('onMessage') !== -1
            ) {
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              if (event.preventDefault) event.preventDefault();
              return true;
            }
          } catch (e) {}
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          try {
            var reason = (event && event.reason && event.reason.message) || String(event && event.reason) || '';
            if (reason.indexOf('onMessage') !== -1 || reason.indexOf('chrome-extension://') !== -1) {
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              if (event.preventDefault) event.preventDefault();
            }
          } catch (e) {}
        }, true);
      })();
    </script>
