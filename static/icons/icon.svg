<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Ring Accent Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Bracket Text Gradient -->
    <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Letters Gradient -->
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Base Container -->
  <!-- <rect x="5" y="5" width="500" height="500" rx="250" fill="url(#bgGrad)" /> -->

  <!-- Inner Tech Accent Ring -->
  <circle cx="256" cy="256" r="245" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="8" opacity="0.85" filter="url(#glow)" />
  <circle cx="256" cy="256" r="225" fill="url(#bgGrad)" stroke="#FFFFFF" stroke-width="1" opacity="0.15" />

  <!-- Center Content: { SS } -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" text-anchor="middle" dominant-baseline="central">
    
    <!-- Left Bracket '{' -->
    <text x="112" y="220" font-size="330" font-weight="300" fill="url(#bracketGrad)" filter="url(#glow)">{</text>
    
    <!-- First 'S' -->
    <text x="200" y="242" font-size="210" font-weight="750" letter-spacing="10" fill="url(#letterGrad)">S</text>
    
    <!-- Second 'S' -->
    <text x="305" y="242" font-size="210" font-weight="750" letter-spacing="0" fill="url(#letterGrad)">S</text>
    
    <!-- Right Bracket '}' -->
    <text x="400" y="220" font-size="330" font-weight="300" fill="url(#bracketGrad)" filter="url(#glow)">}</text>
    
  </g>
  
  <!-- Sleek Accent Dots -->
  <circle cx="256" cy="380" r="5" fill="#38BDF8" opacity="0.8" />
</svg>
